server {
    listen 80;
    listen [::]:80;
    server_name gymbro.spmbbanjarkab.web.id gymbro-backend.spmbbanjarkab.web.id;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/gymbro-acme;
        default_type text/plain;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name gymbro.spmbbanjarkab.web.id;
    ssl_certificate /etc/letsencrypt/live/gymbro-frontend/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gymbro-frontend/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=15552000" always;

    location / {
        proxy_pass http://127.0.0.1:4121;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name gymbro-backend.spmbbanjarkab.web.id;
    ssl_certificate /etc/letsencrypt/live/gymbro-backend/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gymbro-backend/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=15552000" always;

    client_max_body_size 1m;
    location /api/ {
        proxy_pass http://127.0.0.1:4120;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
    location /health {
        proxy_pass http://127.0.0.1:4120;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / {
        return 404;
    }
}
